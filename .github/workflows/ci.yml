name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build não conecta no banco (cliente é lazy + páginas dynamic),
          # mas damos um valor inócuo caso algum import leia a env.
          DATABASE_URL: postgres://build:build@localhost:5432/build
          NODE_ENV: production
